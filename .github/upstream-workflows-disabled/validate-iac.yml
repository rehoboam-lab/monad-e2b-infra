name: Validate IaC

on:
  workflow_call:
    inputs:
      run-validation:
        type: boolean
        description: "Whether to run Terraform validation"
        required: false
        default: true

permissions:
  contents: read

jobs:
  run-terraform-validation:
    name: Run Terraform validation
    if: ${{ inputs.run-validation == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@v2.1.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM }}"

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "${{ env.PACKER }}"

      - name: Verify pinned IaC tool versions
        run: |
          test "$(terraform version -json | jq -r .terraform_version)" = "1.7.5"
          test "$(packer version | sed -n 's/^Packer v//p')" = "${PACKER}"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Check Packer formatting
        run: packer fmt -check iac/provider-gcp/nomad-cluster-disk-image

      - name: Test workload topology and quota guard
        run: make -C iac/provider-gcp workload-plan-assertions-test

      - name: Validate Packer quota reserve
        working-directory: ./iac/provider-gcp/nomad-cluster-disk-image
        run: |
          packer init .
          packer validate \
            -var gcp_project_id=quota-validation \
            -var gcp_zone=us-east4-a \
            -var network_name=quota-validation \
            -var subnet_name=quota-validation \
            .

      - name: Validate terraform
        working-directory: ./iac/provider-gcp
        run: |
          terraform init -backend=false
          terraform validate

  validate_terraform:
    needs: run-terraform-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Terraform validation result
        run: |
          if [[ "${{ inputs.run-validation }}" != "true" ]]; then
            echo "Terraform validation skipped because IaC paths did not change"
            exit 0
          fi

          if [[ "${{ needs.run-terraform-validation.result }}" != "success" ]]; then
            echo "Terraform validation result: ${{ needs.run-terraform-validation.result }}"
            exit 1
          fi

          echo "Terraform validation succeeded"
